name: Validate syntax

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libicu-dev
          python3 -m pip install --requirement requirements.txt
      - name: Build, validate, and package
        run: npm run package
      - name: Verify committed definitions match the generator
        run: git diff --exit-code -- Nushell.cotsyntax Nushell.yml build-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: Nushell-CotEditor
          path: dist/Nushell-CotEditor.zip
